<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>

    <!-- ✅ Load Netlify CMS from jsDelivr (more reliable than unpkg) -->
    <script src="https://cdn.jsdelivr.net/npm/netlify-cms-app@2.15.83/dist/netlify-cms.js"></script>
  </head>
  <body>
    <script>
      window.addEventListener("load", function () {
        if (window.NetlifyCmsApp) {
          NetlifyCmsApp.init();
        } else {
          console.error("NetlifyCmsApp failed to load.");
        }
      });
    </script>
  </body>
</html>
